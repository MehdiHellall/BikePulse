[paths]
data_dir = "data"

[gbfs]
status_url = "https://velib-metropole-opendata.smovengo.cloud/opendata/Velib_Metropole/station_status.json"
information_url = "https://velib-metropole-opendata.smovengo.cloud/opendata/Velib_Metropole/station_information.json"
user_agent = "BikePulse/0.1 (+https://github.com/MehdiHellall/BikePulse)"
timeout_seconds = 10.0
max_retries = 2
backoff_seconds = 0.5

[collection]
max_station_age_seconds = 300
max_feed_age_seconds = 300
expected_interval_minutes = 5
daily_station_refresh_hour_utc = 3
