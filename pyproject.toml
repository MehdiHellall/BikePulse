[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bikepulse"
version = "0.1.0"
description = "Velib stockout prediction data pipeline and MVP app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "altair>=5.3",
  "duckdb>=1.0",
  "httpx>=0.27",
  "polars>=1.5",
  "pydeck>=0.9",
  "pyarrow>=16.1",
  "pydantic>=2.8",
  "streamlit>=1.37",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "build>=1.2",
  "hatchling>=1.25",
  "pytest-playwright>=0.7",
]

[project.scripts]
bikepulse-collect = "bikepulse.collector.cli:collect_main"
bikepulse-refresh-stations = "bikepulse.collector.cli:stations_main"
bikepulse-compact-hour = "bikepulse.data.cli:compact_hour_main"
bikepulse-quality-report = "bikepulse.data.cli:quality_report_main"
bikepulse-app = "bikepulse.app.main:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.pytest.ini_options]
addopts = "-ra --cov=bikepulse --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = [
  "e2e: browser tests that require Playwright and a local Streamlit server",
]

[tool.coverage.run]
omit = [
  "src/bikepulse/*/cli.py",
  "src/bikepulse/app/main.py",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["bikepulse"]
